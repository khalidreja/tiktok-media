name: decode-media
on:
  push:
    paths: ['**.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(git ls-files '*.b64'); do base64 -d "$f" > "${f%.b64}.jpg"; git rm -q "$f"; done
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -m "decode media" && git push || true
